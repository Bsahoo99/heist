[project]
name = "heist"
version = "0.1.0"
description = "Heist engine: shows how a vibe-coded app gets robbed"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "modal>=1.6.2",
    "openai>=3.40.0",
    "pglast>=8.7",
    "pydantic>=2.14.1",
    "sse-starlette>=3.6.0",
    "supabase>=2.33.0",
    "tomli-w>=1.2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
include = ["heist", "tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]
